<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI智能选股与量化交易系统联动流程图 (HTML5 Canvas)</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: rgba(255, 255, 255, 0.96);
      --border-color: #cbd5e1;
      --primary: #2563eb;
      --quant: #059669;
      --danger: #dc2626;
      --warning: #d97706;
      --text-main: #0f172a;
      --text-sub: #475569;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      background-color: #f1f5f9;
      color: var(--text-main);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* Top Header & Toolbar */
    header {
      height: 60px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-badge {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      padding: 5px 10px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }
    .brand h1 {
      font-size: 17px;
      font-weight: 700;
      color: #0f172a;
    }
    .brand span {
      font-size: 12px;
      color: #64748b;
      background: #f1f5f9;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #334155;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
      user-select: none;
    }
    .btn:hover {
      background: #f8fafc;
      border-color: #94a3b8;
      color: #0f172a;
    }
    .btn.active {
      background: #eff6ff;
      border-color: #2563eb;
      color: #1d4ed8;
    }
    .btn.warn-btn.active {
      background: #fef3c7;
      border-color: #d97706;
      color: #b45309;
    }
    .btn-primary {
      background: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #1d4ed8;
      border-color: #1d4ed8;
      color: #ffffff;
    }
    .divider {
      width: 1px;
      height: 22px;
      background: #e2e8f0;
      margin: 0 4px;
    }

    /* Main Workspace */
    .workspace {
      flex: 1;
      position: relative;
      display: flex;
      overflow: hidden;
    }
    #canvas-container {
      flex: 1;
      position: relative;
      cursor: grab;
      background-color: #f8fafc;
    }
    #canvas-container:active {
      cursor: grabbing;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Floating Legend */
    .legend-card {
      position: absolute;
      left: 16px;
      bottom: 16px;
      background: var(--panel-bg);
      backdrop-filter: blur(8px);
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 16px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
      font-size: 12px;
      color: #334155;
      z-index: 5;
    }
    .legend-title {
      font-weight: 700;
      margin-bottom: 8px;
      color: #0f172a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .legend-grid {
      display: grid;
      grid-template-columns: repeat(2, auto);
      gap: 6px 16px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      display: inline-block;
    }

    /* Right Side Inspector Drawer */
    .inspector {
      width: 390px;
      background: #ffffff;
      border-left: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      box-shadow: -4px 0 15px rgba(15, 23, 42, 0.05);
      z-index: 8;
      transition: transform 0.25s ease;
    }
    .inspector-header {
      padding: 16px 20px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
    }
    .inspector-header h2 {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
    }
    .inspector-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px;
    }
    .tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .tag-data { background: #f1f5f9; color: #334155; }
    .tag-dify { background: #dbeafe; color: #1d4ed8; }
    .tag-quant { background: #d1fae5; color: #047857; }
    .tag-warn { background: #fef3c7; color: #b45309; margin-left: 6px; }

    .detail-title {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 12px;
    }
    .detail-section {
      margin-bottom: 16px;
    }
    .detail-section h4 {
      font-size: 12px;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .detail-section p, .detail-section li {
      font-size: 13px;
      line-height: 1.6;
      color: #334155;
    }
    .detail-section ul {
      padding-left: 18px;
    }
    .gap-box {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-left: 4px solid #f59e0b;
      border-radius: 6px;
      padding: 12px;
      margin-top: 10px;
    }
    .gap-box h5 {
      color: #b45309;
      font-size: 13px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .gap-box p {
      font-size: 12.5px;
      color: #78350f;
      line-height: 1.55;
    }
    .code-block {
      background: #0f172a;
      color: #e2e8f0;
      font-family: "JetBrains Mono", "Fira Code", monospace;
      font-size: 11.5px;
      padding: 10px 12px;
      border-radius: 6px;
      overflow-x: auto;
      line-height: 1.5;
      margin-top: 6px;
    }
    .hint-tip {
      font-size: 12px;
      color: #64748b;
      padding: 10px 20px;
      border-top: 1px solid #e2e8f0;
      background: #f8fafc;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-badge">HTML5 CANVAS</div>
      <h1>AI智能选股与量化交易联动流程图</h1>
      <span>Dify 投研引擎 + SpringBoot/Vue 量化交易系统</span>
    </div>
    <div class="toolbar">
      <button class="btn active" id="btn-anim" onclick="toggleAnimation()">⚡ 数据流动画: 开启</button>
      <button class="btn warn-btn active" id="btn-gaps" onclick="toggleGaps()">⚠️ 显示不完整/待补充标记 (7处)</button>
      <div class="divider"></div>
      <button class="btn" onclick="zoomBy(1.15)">＋ 放大</button>
      <button class="btn" onclick="zoomBy(0.85)">－ 缩小</button>
      <button class="btn" onclick="resetView()">⟲ 自适应居中</button>
      <div class="divider"></div>
      <button class="btn btn-primary" onclick="exportPNG()">⬇ 导出高清 PNG</button>
    </div>
  </header>

  <div class="workspace">
    <div id="canvas-container">
      <canvas id="flowCanvas"></canvas>

      <div class="legend-card">
        <div class="legend-title">
          <span>图例与操作说明</span>
          <span id="zoom-indicator" style="color:#64748b;font-weight:normal;">100%</span>
        </div>
        <div class="legend-grid">
          <div class="legend-item"><span class="dot" style="background:#dbeafe;border:1.5px solid #2563eb;"></span>Dify 核心分析节点</div>
          <div class="legend-item"><span class="dot" style="background:#e0e7ff;border:1.5px solid #4f46e5;"></span>Dify 数据库/向量库</div>
          <div class="legend-item"><span class="dot" style="background:#dcfce7;border:1.5px solid #16a34a;"></span>重大利多 / 多头流转</div>
          <div class="legend-item"><span class="dot" style="background:#fee2e2;border:1.5px solid #dc2626;"></span>重大利空 / 空头流转</div>
          <div class="legend-item"><span class="dot" style="background:#d1fae5;border:1.5px solid #059669;"></span>SpringBoot+Vue 量化模块</div>
          <div class="legend-item"><span class="dot" style="background:#f59e0b;border-radius:50%;"></span>⚠️ 流程待补充/断点提示</div>
        </div>
        <div style="margin-top:8px;font-size:11px;color:#64748b;">
          💡 滚轮缩放画布 | 按住左键拖拽平移 | <b>点击任意节点</b>在右侧查看详细技术逻辑与问题排查
        </div>
      </div>
    </div>

    <aside class="inspector" id="inspector">
      <div class="inspector-header">
        <h2>📋 节点详情与流程完整性诊断</h2>
        <span style="font-size:12px;color:#2563eb;cursor:pointer;" onclick="showOverview()">查看全局诊断汇总</span>
      </div>
      <div class="inspector-body" id="inspector-content">
        <!-- Populated dynamically via JS -->
      </div>
      <div class="hint-tip">
        提示：点击画布中的各个流程节点或橙色「⚠️」角标可切换查看对应模块的详细设计与待补充点。
      </div>
    </aside>
  </div>

<script>

 * 1. 流程图逻辑坐标与数据结构定义 (基于 1600 x 1120 虚拟画布坐标系)
 * ============================================================================

const VIRTUAL_HEIGHT = 1140;

    x: 30, y: 865, w: 1560, h: 245,
    bgColor: "#ecfdf5", borderColor: "#059669", titleColor: "#047857", dashed: false
  }
];

// 节点定义 (Nodes)
const nodes = [
  // --- Zone A: 基础数据层 ---
  {
    id: "D1",
    zone: "基础数据层",
    title: "1. 监控/收集权威新闻",

      "• 数据源：1~2个权威财经网站",
      "• 频率：每 3 分钟抓取一次",

      gap: "【不完整点 #1：高频抓取去重缺失】每3分钟抓取一次，同一重大事件会被多家媒体反复报道或重复抓取。若无去重机制，会重复触发下游 HTTP 平仓与激进交易下单。建议在进入分析前增加 URL/标题 Hash 去重 + Dify 向量库近24小时新闻摘要余弦相似度去重（阈值 > 0.85 跳过）。"

      outputs: "结构化行情表 + 转化为自然语言特征描述写入 Dify 向量数据库",
      gap: "【不完整点 #2：纯数值K线存入向量库的检索局限】向量数据库擅长语义检索，对纯浮点数K线序列检索效果差。建议在同步时将K线与盘口转化为「语义特征卡片」（如：『2026-10-13 放量突破20日均线，量比2.4，换手率8.5%，外盘显著大于内盘，委比+35%』）再向量化入库，或提供精确 SQL 查询 Tool 供 Dify 调用。"

    }
  },
  {
    id: "DB1",
    zone: "Dify 功能区",

/**
 * ============================================================================
 * 2. Canvas 渲染与交互状态管理
 * ============================================================================
 */
const canvas = document.getElementById("flowCanvas");
const ctx = canvas.getContext("2d");
const container = document.getElementById("canvas-container");

let scale = 1;
let offsetX = 0;
let offsetY = 0;
let isDragging = false;
let dragStartX = 0;
let dragStartY = 0;

let hoveredNode = null;
let selectedNode = null;
let showAnimation = true;
let showGapBadges = true;
let animOffset = 0;

function resizeCanvas() {
  const rect = container.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  resetView();
}

function resetView() {
  const rect = container.getBoundingClientRect();
  const scaleX = (rect.width - 40) / VIRTUAL_WIDTH;
  const scaleY = (rect.height - 40) / VIRTUAL_HEIGHT;
  scale = Math.min(scaleX, scaleY, 1.1);
  offsetX = (rect.width - VIRTUAL_WIDTH * scale) / 2;
  offsetY = (rect.height - VIRTUAL_HEIGHT * scale) / 2;
  updateZoomIndicator();
}

function zoomBy(factor) {
  const rect = container.getBoundingClientRect();
  const cx = rect.width / 2;
  const cy = rect.height / 2;
  const newScale = Math.min(Math.max(scale * factor, 0.35), 2.5);
  offsetX = cx - (cx - offsetX) * (newScale / scale);
  offsetY = cy - (cy - offsetY) * (newScale / scale);
  scale = newScale;
  updateZoomIndicator();
}

function updateZoomIndicator() {
  document.getElementById("zoom-indicator").textContent = Math.round(scale * 100) + "%";
}

// 辅助绘制圆角矩形
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// 绘制网格背景
function drawGrid(ctx, width, height) {
  ctx.save();
  ctx.strokeStyle = "#e2e8f0";
  ctx.lineWidth = 1;
  const step = 30 * scale;
  const startX = offsetX % step;
  const startY = offsetY % step;
  ctx.beginPath();
  for (let x = startX; x < width; x += step) {
    ctx.moveTo(x, 0);
    ctx.lineTo(x, height);
  }
  for (let y = startY; y < height; y += step) {
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
  }
  ctx.stroke();
  ctx.restore();
}

// 主渲染循环
function render() {
  const dpr = window.devicePixelRatio || 1;
  const width = canvas.width / dpr;
  const height = canvas.height / dpr;

  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, width, height);

  drawGrid(ctx, width, height);

  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);

  // 1. 绘制顶部大标题
  ctx.fillStyle = "#0f172a";
  ctx.font = "bold 22px -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("AI 智能选股与量化交易系统全链路操作流程图 (Dify + SpringBoot/Vue)", VIRTUAL_WIDTH / 2, 38);

  // 2. 绘制三大功能区泳道 (Zones)
  zones.forEach(z => {
    ctx.save();
    roundRect(ctx, z.x, z.y, z.w, z.h, 12);
    ctx.fillStyle = z.bgColor;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = z.borderColor;
    if (z.dashed) ctx.setLineDash([8, 6]);
    ctx.stroke();
    ctx.setLineDash([]);

    // 泳道标题栏
    ctx.fillStyle = z.titleColor;
    ctx.font = "bold 15px -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(z.title, z.x + 18, z.y + 26);

    ctx.fillStyle = "#64748b";
    ctx.font = "12.5px -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif";
    ctx.fillText(z.subtitle, z.x + 18, z.y + 46);
    ctx.restore();
  });

  // 3. 绘制连线与动态粒子 (Edges)
  edges.forEach(edge => {
    const pts = edge.points;
    const isHighlighted =
      (hoveredNode && (hoveredNode.id === edge.from || hoveredNode.id === edge.to)) ||
      (selectedNode && (selectedNode.id === edge.from || selectedNode.id === edge.to));

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) {
      ctx.lineTo(pts[i][0], pts[i][1]);
    }
    ctx.strokeStyle = edge.color;
    ctx.lineWidth = isHighlighted ? 3.5 : (edge.thick ? 2.6 : 2);
    if (edge.dashed) ctx.setLineDash([6, 5]);
    ctx.stroke();
    ctx.setLineDash([]);

    // 绘制箭头 (在最后一段末端)
    const last = pts[pts.length - 1];
    const prev = pts[pts.length - 2];
    const angle = Math.atan2(last[1] - prev[1], last[0] - prev[0]);
    const headLen = 10;
    ctx.beginPath();
    ctx.moveTo(last[0], last[1]);
    ctx.lineTo(last[0] - headLen * Math.cos(angle - Math.PI / 6), last[1] - headLen * Math.sin(angle - Math.PI / 6));
    ctx.lineTo(last[0] - headLen * Math.cos(angle + Math.PI / 6), last[1] - headLen * Math.sin(angle + Math.PI / 6));
    ctx.closePath();
    ctx.fillStyle = edge.color;
    ctx.fill();

    // 绘制动态数据流光点
    if (showAnimation) {
      drawFlowParticles(ctx, pts, edge.color);
    }

    // 绘制连线标签胶囊
    if (edge.label) {
      let midX, midY;
      if (pts.length === 2) {
        midX = (pts[0][0] + pts[1][0]) / 2;
        midY = (pts[0][1] + pts[1][1]) / 2;
      } else {
        // 取最长线段的中点
        let maxLen = 0, bestIdx = 0;
        for (let i = 0; i < pts.length - 1; i++) {
          const d = Math.hypot(pts[i+1][0] - pts[i][0], pts[i+1][1] - pts[i][1]);
          if (d > maxLen) { maxLen = d; bestIdx = i; }
        }
        midX = (pts[bestIdx][0] + pts[bestIdx+1][0]) / 2;
        midY = (pts[bestIdx][1] + pts[bestIdx+1][1]) / 2;
      }

      ctx.font = "bold 11.5px -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif";
      const textWidth = ctx.measureText(edge.label).width;
      const padX = 8, padY = 4;
      roundRect(ctx, midX - textWidth / 2 - padX, midY - 10, textWidth + padX * 2, 20, 10);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
      ctx.lineWidth = 1.2;
      ctx.strokeStyle = edge.color;
      ctx.stroke();

      ctx.fillStyle = edge.color;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(edge.label, midX, midY);
    }
    ctx.restore();
  });

  // 4. 绘制节点 (Nodes)
  nodes.forEach(node => {
    const isHovered = hoveredNode && hoveredNode.id === node.id;
    const isSelected = selectedNode && selectedNode.id === node.id;

    ctx.save();
    // 阴影效果
    ctx.shadowColor = isSelected ? "rgba(37, 99, 235, 0.35)" : (isHovered ? "rgba(15, 23, 42, 0.18)" : "rgba(15, 23, 42, 0.07)");
    ctx.shadowBlur = isSelected || isHovered ? 16 : 8;
    ctx.shadowOffsetY = 3;

    // 节点主体背景
    roundRect(ctx, node.x, node.y, node.w, node.h, 10);
    ctx.fillStyle = node.bg;
    ctx.fill();

    // 节点边框
    ctx.lineWidth = isSelected ? 3 : (isHovered ? 2.5 : 1.8);
    ctx.strokeStyle = isSelected ? "#1d4ed8" : node.border;
    ctx.stroke();

    ctx.shadowColor = "transparent";

    // 节点顶部 Header 条
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(node.x + 10, node.y);
    ctx.lineTo(node.x + node.w - 10, node.y);
    ctx.quadraticCurveTo(node.x + node.w, node.y, node.x + node.w, node.y + 10);
    ctx.lineTo(node.x + node.w, node.y + 32);
    ctx.lineTo(node.x, node.y + 32);
    ctx.lineTo(node.x, node.y + 10);
    ctx.quadraticCurveTo(node.x, node.y, node.x + 10, node.y);
    ctx.closePath();
    ctx.fillStyle = node.headerBg;
    ctx.fill();

    // 节点标题文字
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 13.5px -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText(node.title, node.x + 12, node.y + 16);
    ctx.restore();

    // 节点正文多行列表
    ctx.fillStyle = "#1e293b";
    ctx.font = "12.5px -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif";
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    let startY = node.y + 42;
    const lineHeight = 21;
    node.lines.forEach((line, idx) => {
      const isSubHeader = line.startsWith("1.") || line.startsWith("2.") || line.startsWith("3.");
      ctx.font = isSubHeader
        ? "bold 12.5px -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif"
        : "12.5px -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif";
      ctx.fillText(line, node.x + 14, startY + idx * lineHeight);
    });

    // 绘制右上角「待补充/不完整」提示角标
    if (showGapBadges && node.badge) {
      ctx.save();
      ctx.font = "bold 11px -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif";
      const bw = ctx.measureText(node.badge).width + 14;
      const bx = node.x + node.w - bw - 6;
      const by = node.y - 11;
      roundRect(ctx, bx, by, bw, 22, 11);
      ctx.fillStyle = "#fef3c7";
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = "#d97706";
      ctx.stroke();

      ctx.fillStyle = "#b45309";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(node.badge, bx + bw / 2, by + 11);
      ctx.restore();
    }

    ctx.restore();
  });

  ctx.restore();

  if (showAnimation) {
    animOffset = (animOffset + 0.006) % 1;
  }
  requestAnimationFrame(render);
}

// 沿折线绘制流动的粒子
function drawFlowParticles(ctx, pts, color) {
  let totalLen = 0;
  const segLens = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const l = Math.hypot(pts[i+1][0] - pts[i][0], pts[i+1][1] - pts[i][1]);
    segLens.push(l);
    totalLen += l;
  }
  const numParticles = Math.max(1, Math.floor(totalLen / 140));
  for (let p = 0; p < numParticles; p++) {
    const t = (animOffset + p / numParticles) % 1;
    let targetDist = t * totalLen;
    for (let i = 0; i < segLens.length; i++) {
      if (targetDist <= segLens[i]) {
        const ratio = targetDist / segLens[i];
        const px = pts[i][0] + (pts[i+1][0] - pts[i][0]) * ratio;
        const py = pts[i][1] + (pts[i+1][1] - pts[i][1]) * ratio;
        ctx.beginPath();
        ctx.arc(px, py, 4, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        break;
      }
      targetDist -= segLens[i];
    }
  }
}

/**
 * ============================================================================
 * 3. 鼠标交互：拖拽平移、滚轮缩放、点击/悬停检测
 * ============================================================================
 */
function screenToVirtual(sx, sy) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (sx - rect.left - offsetX) / scale,
    y: (sy - rect.top - offsetY) / scale
  };
}

function getNodeAt(vx, vy) {
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    if (vx >= n.x && vx <= n.x + n.w && vy >= n.y - 12 && vy <= n.y + n.h) {
      return n;
    }
  }
  return null;
}

container.addEventListener("mousedown", e => {
  const v = screenToVirtual(e.clientX, e.clientY);
  const clicked = getNodeAt(v.x, v.y);
  if (clicked) {
    selectedNode = clicked;
    renderNodeInspector(clicked);
  }
  isDragging = true;
  dragStartX = e.clientX - offsetX;
  dragStartY = e.clientY - offsetY;
});

window.addEventListener("mousemove", e => {
  if (isDragging) {
    offsetX = e.clientX - dragStartX;
    offsetY = e.clientY - dragStartY;
    return;
  }
  const v = screenToVirtual(e.clientX, e.clientY);
  const hit = getNodeAt(v.x, v.y);
  hoveredNode = hit;
  container.style.cursor = hit ? "pointer" : "grab";
});

window.addEventListener("mouseup", () => {
  isDragging = false;
});

container.addEventListener("wheel", e => {
  e.preventDefault();
  const rect = container.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  const newScale = Math.min(Math.max(scale * factor, 0.35), 2.5);
  offsetX = mx - (mx - offsetX) * (newScale / scale);
  offsetY = my - (my - offsetY) * (newScale / scale);
  scale = newScale;
  updateZoomIndicator();
}, { passive: false });

/**
 * ============================================================================
 * 4. 右侧详情面板与工具栏动作
 * ============================================================================
 */
function renderNodeInspector(node) {
  const el = document.getElementById("inspector-content");

  if (node.zone.includes("Dify")) tagClass = "tag-dify";
  if (node.zone.includes("量化")) tagClass = "tag-quant";

  const gapHtml = node.details.gap
    ? `<div class="gap-box">
         <h5>⚠️ 流程完整性诊断与补充建议</h5>
         <p>${node.details.gap}</p>
       </div>`
    : "";

  el.innerHTML = `
    <div>
      <span class="tag ${tagClass}">${node.zone}</span>
      ${node.badge ? `<span class="tag tag-warn">${node.badge}</span>` : ""}
    </div>
    <div class="detail-title">${node.title}</div>
    <div class="detail-section">
      <h4>模块核心职责</h4>
      <p>${node.details.role}</p>
    </div>
    <div class="detail-section">
      <h4>执行步骤明细</h4>
      <ul>
        ${node.lines.map(l => `<li>${l.replace(/^[•\s]+/, "")}</li>`).join("")}
      </ul>
    </div>
    <div class="detail-section">
      <h4>输入数据 (Inputs)</h4>
      <p>${node.details.inputs}</p>
    </div>
    <div class="detail-section">
      <h4>输出与下游动作 (Outputs)</h4>
      <p>${node.details.outputs}</p>
    </div>
    ${gapHtml}
  `;
}

function toggleAnimation() {
  showAnimation = !showAnimation;
  const btn = document.getElementById("btn-anim");
  btn.textContent = showAnimation ? "⚡ 数据流动画: 开启" : "⚡ 数据流动画: 暂停";
  btn.classList.toggle("active", showAnimation);
}

function toggleGaps() {
  showGapBadges = !showGapBadges;
  const btn = document.getElementById("btn-gaps");
  btn.classList.toggle("active", showGapBadges);
}

function exportPNG() {
  // 创建离屏高清 Canvas 完整导出整张流程图
  const exportCanvas = document.createElement("canvas");
  const exportScale = 2;
  exportCanvas.width = VIRTUAL_WIDTH * exportScale;
  exportCanvas.height = VIRTUAL_HEIGHT * exportScale;
  const ectx = exportCanvas.getContext("2d");

  const prevScale = scale, prevX = offsetX, prevY = offsetY;
  // 临时在离屏 Canvas 上绘制
  ectx.fillStyle = "#f8fafc";
  ectx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

  // Swap context logic by rendering directly onto exportCanvas via current canvas snapshot or re-centering
  resetView();
  setTimeout(() => {
    const link = document.createElement("a");
    link.download = "AI智能选股与量化交易流程图_Canvas.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  }, 60);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();
showOverview();
requestAnimationFrame(render);
