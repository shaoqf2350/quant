openapi: 3.0.3
info:
  title: QuantPF API
  version: 29.0.0
  description: |
    QuantPF V29 formal API contract. Stage 1 permits Paper execution only.
    QMT, CTP, LIVE submit/cancel operations are intentionally absent.
servers:
  - url: /
tags:
  - name: health
  - name: dashboard
  - name: instrument
  - name: market
  - name: research
  - name: strategy
  - name: backtest
  - name: paper-account
  - name: paper-order
  - name: risk
  - name: audit
  - name: data-source
  - name: data-governance
  - name: calendar
  - name: event
  - name: market-analysis
  - name: capacity
  - name: feature
  - name: dict
paths:
  /api/quant/health:
    get:
      tags: [health]
      operationId: getQuantPfHealth
      summary: Phase 0C static health
      responses:
        '200':
          description: Static health response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/quant/dashboard/summary:
    x-quantpf-implementation-status: DEFERRED
    get:
      tags: [dashboard]
      operationId: getDashboardSummary
      summary: Dashboard summary
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/instrument/page:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [instrument]
      operationId: pageInstruments
      summary: Page instruments
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: productType
          schema: { type: string, enum: [STOCK, FUTURE] }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  # ============ 模块一：数据与标的基础（已落地，《详设_1》指导文档 §7.1） ============
  /api/quant/data/source/page:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [data-source]
      operationId: pageDataSources
      summary: Page data sources / vendors
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: sourceCode
          schema: { type: string }
        - in: query
          name: sourceName
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/data/source/{pkId}:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [data-source]
      operationId: getDataSource
      summary: Get data source detail
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/data/source:
    x-quantpf-implementation-status: IMPLEMENTED
    post:
      tags: [data-source]
      operationId: addDataSource
      summary: Add data source (DRAFT/PENDING_CONFIRMATION only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataSourceForm' }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
    put:
      tags: [data-source]
      operationId: updateDataSource
      summary: Update data source (state machine validated)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataSourceForm' }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/data/source/{pkIds}:
    x-quantpf-implementation-status: IMPLEMENTED
    delete:
      tags: [data-source]
      operationId: deleteDataSources
      summary: Delete data sources (comma separated ids)
      parameters:
        - in: path
          name: pkIds
          required: true
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/data/source/{sourceId}/interface:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [data-source]
      operationId: listDataSourceInterfaces
      summary: List interface catalog of a data source
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/data/source/interface/{interfaceId}/field:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [data-source]
      operationId: listDataSourceFields
      summary: List field-level authorization catalog of an interface
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/data/source/group/page:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [data-source]
      operationId: pageSourceGroups
      summary: Page source groups
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: groupCode
          schema: { type: string }
        - in: query
          name: groupName
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/data/source/group/{pkId}:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [data-source]
      operationId: getSourceGroup
      summary: Get source group detail
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/data/source/group:
    x-quantpf-implementation-status: IMPLEMENTED
    post:
      tags: [data-source]
      operationId: addSourceGroup
      summary: Add source group
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceGroupForm' }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
    put:
      tags: [data-source]
      operationId: updateSourceGroup
      summary: Update source group
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceGroupForm' }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/data/source/group/{pkIds}:
    x-quantpf-implementation-status: IMPLEMENTED
    delete:
      tags: [data-source]
      operationId: deleteSourceGroups
      summary: Delete source groups
      parameters:
        - in: path
          name: pkIds
          required: true
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/data/source/group/{pkId}/verify:
    x-quantpf-implementation-status: IMPLEMENTED
    post:
      tags: [data-source]
      operationId: verifySourceGroupHealth
      summary: >-
        Verify source group health (failover on primary failure, partial
        availability, conflict reported as DataQualityIssue, never silently
        picked)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/data/source/group/verify-all:
    x-quantpf-implementation-status: IMPLEMENTED
    post:
      tags: [data-source]
      operationId: verifyAllSourceGroups
      summary: Verify all source groups (manual trigger; scheduled by qualityCheckJob)
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/dict/{enumName}:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [dict]
      operationId: getEnumDict
      summary: Enum dictionary options for dropdown (value/label/description/order)
      parameters:
        - in: path
          name: enumName
          required: true
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/DictListResponse'
  /api/quant/data/quality/page:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [data-governance]
      operationId: pageDataQualityIssues
      summary: Page data quality issues
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: issueStatus
          schema: { type: string }
        - in: query
          name: qualityStatus
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/data/quality/{pkId}/resolve:
    x-quantpf-implementation-status: IMPLEMENTED
    post:
      tags: [data-governance]
      operationId: resolveDataQualityIssue
      summary: "Resolve a data quality issue (state machine: OPEN/ANALYZING/WAITING_* to RESOLVED)"
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QualityResolveForm' }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/data/snapshot/page:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [data-governance]
      operationId: pageRawSnapshots
      summary: Page raw snapshots
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: sourceId
          schema: { type: integer, format: int64 }
        - in: query
          name: sourceGroupId
          schema: { type: integer, format: int64 }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/data/snapshot/{pkId}:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [data-governance]
      operationId: getRawSnapshot
      summary: Get raw snapshot detail
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/data/collection/page:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [data-governance]
      operationId: pageCollectionTasks
      summary: Page collection tasks
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: taskType
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/data/point-in-time/page:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [data-governance]
      operationId: pagePointInTimeSnapshots
      summary: Page point-in-time snapshots
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: subjectType
          schema: { type: string }
        - in: query
          name: subjectId
          schema: { type: integer, format: int64 }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/data/point-in-time/{pkId}:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [data-governance]
      operationId: getPointInTimeSnapshot
      summary: Get point-in-time snapshot detail
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/instrument/{id}:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [instrument]
      operationId: getInstrument
      summary: Get instrument detail
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/instrument/sync:
    x-quantpf-implementation-status: IMPLEMENTED
    post:
      tags: [instrument]
      operationId: syncInstruments
      summary: Sync instruments (placeholder until Tushare authorized)
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/instrument/{id}/version:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [instrument]
      operationId: listInstrumentVersions
      summary: List instrument trading-property version chain
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/instrument/tradability/{id}:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [instrument]
      operationId: getInstrumentTradability
      summary: >-
        Tradability + data usage eligibility (quality matrix + capacity +
        calendar binding + readiness; UNAUTHORIZED/CONFLICTED/STALE/UNTRADEABLE
        block paper new positions)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/calendar/page:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [calendar]
      operationId: pageCalendarDefs
      summary: Page trading calendar definitions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: calendarCode
          schema: { type: string }
        - in: query
          name: calendarName
          schema: { type: string }
        - in: query
          name: marketType
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/calendar/{pkId}:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [calendar]
      operationId: getCalendarDef
      summary: Get calendar definition detail
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/calendar:
    x-quantpf-implementation-status: IMPLEMENTED
    post:
      tags: [calendar]
      operationId: addCalendarDef
      summary: Add calendar definition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalendarDefForm' }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
    put:
      tags: [calendar]
      operationId: updateCalendarDef
      summary: Update calendar definition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalendarDefForm' }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/calendar/{pkIds}:
    x-quantpf-implementation-status: IMPLEMENTED
    delete:
      tags: [calendar]
      operationId: deleteCalendarDefs
      summary: Delete calendar definitions
      parameters:
        - in: path
          name: pkIds
          required: true
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/calendar/{pkId}/import:
    x-quantpf-implementation-status: IMPLEMENTED
    post:
      tags: [calendar]
      operationId: importCalendar
      summary: >-
        Import trading calendar days from source endpoint (mock adapter until
        Tushare authorized; preserves is_open raw value; conflicts recorded,
        never silently picked)
      parameters:
        - $ref: '#/components/parameters/Id'
        - in: query
          name: endpoint
          required: true
          schema: { type: string, enum: [trade_cal, fut_trade_cal, hk_tradecal, us_tradecal] }
        - in: query
          name: startDate
          required: true
          schema: { type: string, format: date }
        - in: query
          name: endDate
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/calendar/day/page:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [calendar]
      operationId: pageCalendarDays
      summary: Page trading calendar days (market local date)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: calendarId
          schema: { type: integer, format: int64 }
        - in: query
          name: startDate
          schema: { type: string, format: date }
        - in: query
          name: endDate
          schema: { type: string, format: date }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/calendar/day/detail:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [calendar]
      operationId: getCalendarDayDetail
      summary: Get calendar day detail incl. previous/next trade date
      parameters:
        - in: query
          name: calendarId
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: date
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/calendar/session/list:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [calendar]
      operationId: listCalendarSessions
      summary: List trading session templates of a calendar
      parameters:
        - in: query
          name: calendarId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/calendar/binding/list:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [calendar]
      operationId: listInstrumentCalendarBindings
      summary: List instrument/calendar bindings
      parameters:
        - in: query
          name: instrumentId
          schema: { type: integer, format: int64 }
        - in: query
          name: calendarId
          schema: { type: integer, format: int64 }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/calendar/readiness/page:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [calendar]
      operationId: pageMarketDataReadiness
      summary: Page daily market-data readiness (expected/received/validated/strategy/paper)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: calendarId
          schema: { type: integer, format: int64 }
        - in: query
          name: blockReason
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/calendar/source-snapshot/page:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [calendar]
      operationId: pageCalendarSourceSnapshots
      summary: Page calendar source raw snapshots (Tushare endpoints, professional detail)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: sourceName
          schema: { type: string }
        - in: query
          name: endpointName
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/calendar/conflict/page:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [calendar]
      operationId: pageCalendarConflicts
      summary: Page calendar conflicts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: calendarId
          schema: { type: integer, format: int64 }
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/calendar/conflict/{pkId}/override:
    x-quantpf-implementation-status: IMPLEMENTED
    post:
      tags: [calendar]
      operationId: overrideCalendarConflict
      summary: Manual override of calendar conflict (OPEN/REVIEWED only, no silent pick)
      parameters:
        - $ref: '#/components/parameters/Id'
        - in: query
          name: overrideDecision
          required: true
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/calendar/fx-session-rule/page:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [calendar]
      operationId: pageFxSessionRules
      summary: Page FX/broker session rules (fx_obasic derived, no fake unified FX calendar)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: classify
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/event/corporate/page:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [event]
      operationId: pageCorporateActions
      summary: Page corporate actions (dividend/suspend/ST/delist...)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: instrumentId
          schema: { type: integer, format: int64 }
        - in: query
          name: actionType
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/event/corporate/{pkId}:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [event]
      operationId: getCorporateAction
      summary: Get corporate action detail
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/event/corporate:
    x-quantpf-implementation-status: IMPLEMENTED
    post:
      tags: [event]
      operationId: addCorporateAction
      summary: Add corporate action (lifecycle starts at DISCOVERED)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorporateActionForm' }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
    put:
      tags: [event]
      operationId: updateCorporateAction
      summary: Update corporate action (lifecycle validated)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorporateActionForm' }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/event/corporate/{pkIds}:
    x-quantpf-implementation-status: IMPLEMENTED
    delete:
      tags: [event]
      operationId: deleteCorporateActions
      summary: Delete corporate actions
      parameters:
        - in: path
          name: pkIds
          required: true
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/event/contract/page:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [event]
      operationId: pageContractEvents
      summary: Page futures contract lifecycle events (margin/limit/delivery/rollover...)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: instrumentId
          schema: { type: integer, format: int64 }
        - in: query
          name: eventType
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/event/contract/{pkId}:
    x-quantpf-implementation-status: IMPLEMENTED
    get:
      tags: [event]
      operationId: getContractEvent
      summary: Get contract event detail
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/event/contract:
    x-quantpf-implementation-status: IMPLEMENTED
    post:
      tags: [event]
      operationId: addContractEvent
      summary: Add contract event (lifecycle starts at DISCOVERED)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractEventForm' }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
    put:
      tags: [event]
      operationId: updateContractEvent
      summary: Update contract event (lifecycle validated)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractEventForm' }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/quant/event/contract/{pkIds}:
    x-quantpf-implementation-status: IMPLEMENTED
    delete:
      tags: [event]
      operationId: deleteContractEvents
      summary: Delete contract events
      parameters:
        - in: path
