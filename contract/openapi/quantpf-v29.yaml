components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: integer, format: int64 }
    Page:
      in: query
      name: pageNum
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
  responses:
    ApiResponse:
      description: Successful API response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    DictListResponse:
      description: Enum dictionary options; data is a list of value/label/description/order.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DictOptionVo'
    PaperAccountListResponse:
      description: Paper account list; data is a bounded list without total count.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaperAccountView'
    PaperLedgerListResponse:
      description: Paper ledger list; data is a bounded list without total count.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaperLedgerEntry'
    PaperOrderListResponse:
      description: Paper order list; data is a bounded list without total count.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaperOrderView'
    PaperOrderResponse:
      description: Paper order response.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PaperOrderView'
    PaperFollowResponse:
      description: Paper Follow session response.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PaperFollowSessionResponse'
    RiskStatusResponse:
      description: Paper risk status response.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RiskStatusView'
    AuditListResponse:
      description: Paper audit list; data is a bounded list without total count.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditView'
    JobExecutionListResponse:
      description: Paper job execution audit list; data is a bounded list without total count.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/JobExecutionView'
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Idempotency or state conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    PaperFollowStartRequest:
      type: object
      required: [accountId, strategyId, mode]
      properties:
        accountId: { type: integer, format: int64 }
        strategyId: { type: integer, format: int64 }
        mode: { type: string, enum: [PAPER] }
    PaperFollowStopRequest:
      type: object
      required: [sessionId]
      properties:
        sessionId: { type: string }
        reason: { type: string, maxLength: 512 }
    PaperFollowSessionResponse:
      type: object
      required: [sessionId, accountId, strategyId, mode, status, idempotent]
      properties:
        sessionId: { type: string }
        accountId: { type: integer, format: int64 }
        strategyId: { type: integer, format: int64 }
        mode: { type: string, enum: [PAPER] }
        status: { type: string, enum: [RUNNING, STOPPED] }
        startedAt: { type: string, format: date-time }
        stoppedAt: { type: string, format: date-time, nullable: true }
        idempotent: { type: boolean }
    HealthResponse:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, example: 200 }
        msg: { type: string, example: 操作成功 }
        data:
          type: object
          required: [status, phase, liveEnabled]
          properties:
            status: { type: string, example: UP }
            phase: { type: string, example: PHASE0C }
            liveEnabled: { type: boolean, example: false }
    ApiResponse:
      type: object
      required: [code, msg]
      properties:
        code: { type: integer, example: 200 }
        msg: { type: string }
        data: {}
    DictOptionVo:
      type: object
      required: [value, label]
      properties:
        value: { type: string }
        label: { type: string }
        description: { type: string, nullable: true }
        order: { type: integer, nullable: true }
    PaperAccountView:
      type: object
      required: [id, accountCode, status, availableCash, frozenCash]
      properties:
        id: { type: integer, format: int64 }
        accountCode: { type: string }
        status: { type: string }
        availableCash: { type: number, format: double }
        frozenCash: { type: number, format: double }
    PaperLedgerEntry:
      type: object
      required: [type, amount, balanceAfter, referenceId, occurredAt]
      properties:
        type: { type: string }
        amount: { type: number, format: double }
        balanceAfter: { type: number, format: double }
        referenceId: { type: string }
        occurredAt: { type: string, format: date-time }
    PaperOrderView:
