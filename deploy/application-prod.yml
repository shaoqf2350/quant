# =====================================================================
# QuantPF Spring Boot 生产 profile（可直接落地版本）
# ---------------------------------------------------------------
# 应用方式（二选一）：
#   1) 替换源码后重新构建：
#      RuoYi-Vue-Plus/ruoyi-admin/src/main/resources/application-prod.yml
#      -> mvn -pl ruoyi-admin -am clean package -P prod -DskipTests
#   2) 运行时外挂（不重新构建）：
#      SPRING_CONFIG_ADDITIONAL_LOCATION=file:/config/
#      容器挂载本文件到 /config/application-prod.yml，并以 -Dspring.profiles.active=prod 启动。
#
# 所有敏感值来自同名环境变量（由 .env / docker-compose 注入），本文件不写明文口令。
# 必需秘密（如 ${MYSQL_PASSWORD}）未设置时会启动即失败，这是预期的 fail-fast。
# 非秘密值使用 ${VAR:默认值}，指向 Compose 网络内的服务名。
# =====================================================================

server:
  port: 8080

spring:
  servlet:
    multipart:
      # 临时文件目录（容器内挂载卷）
      location: /ruoyi/server/temp
      max-file-size: 10MB
      max-request-size: 20MB

  # ---------------- 数据源（MySQL，QuantPF 主库） ----------------
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          driverClassName: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:quantpf}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowMultiQueries=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
          username: ${MYSQL_USER}
          password: ${MYSQL_PASSWORD}
      hikari:
        maxPoolSize: 20
        minIdle: 10
        connectionTimeout: 30000
        validationTimeout: 5000
        idleTimeout: 600000
        maxLifetime: 1800000
        keepaliveTime: 30000

  # ---------------- Redis（缓存 / 锁 / 发布订阅；redisson 继承此配置） ----------------
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      password: ${REDIS_PASSWORD}
      timeout: 10s
      ssl:
        enabled: false

# ---------------- 安全：Sa-Token JWT 签名密钥（生产必改，>= 32 字节） ----------------
sa-token:
  jwt-secret-key: ${JWT_SECRET}

# ---------------- QuantPF 对象存储（MinIO） ----------------
minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
  bucket: ${MINIO_BUCKET:qpf-snapshots}

# ---------------- XXL-JOB 执行器（内嵌于 Spring Boot；ADR-10 已下线 SnailJob） ----------------
xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://xxl-job-admin:8080/xxl-job-admin}
    accessToken: ${XXL_JOB_ACCESS_TOKEN:}
    executor:
      appname: quant-executor
      address: ''
      ip: ''
      port: 9999
      logpath: /ruoyi/server/logs/xxl-job
      logretentiondays: 30

# ---------------- Dify 研究编排（外部，独立数据域） ----------------
dify:
  base-url: ${DIFY_BASE_URL:http://host.docker.internal:5001}
  app-api-key: ${DIFY_APP_API_KEY:}
  connect-timeout: 5s
  read-timeout: 180s

# ---------------- TradingAgents 多智能体研究引擎（外部，独立数据域） ----------------
trading-agents:
  base-url: ${TRADING_AGENTS_BASE_URL:http://host.docker.internal:8000}
  api-key: ${TRADING_AGENTS_API_KEY:}
  connect-timeout: 5s
  read-timeout: 300s

# ---------------- Tushare 数据源 ----------------
tushare:
  token: ${TUSHARE_TOKEN:}

# ---------------- RuoYi 附件能力：一期不用则关闭 ----------------
snail-job:
  enabled: false
snail-ai:
  enabled: false

logging:
  level:
    org.dromara: info
    org.springframework: warn