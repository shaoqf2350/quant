# =====================================================================
# QuantPF 前端 nginx 站点配置
# ---------------------------------------------------------------
# 用途：托管 plus-ui 构建产物 dist/，并把 /prod-api 反向代理到 Spring Boot。
# 挂载：容器内 /etc/nginx/conf.d/default.conf（或映射到外层的 nginx.conf）。
# 依赖：同 Compose 网络内 Spring Boot 服务名 = server（容器内端口 8080）。
# 校验：VITE_APP_BASE_API=/prod-api；SSE 消息 /prod-api/resource/message；
#       WebSocket /prod-api/resource/message（可选）。
# =====================================================================

# 有 Upgrade 头（WebSocket）时升级连接；否则保持空（SSE 走 HTTP/1.1 不死连）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # 上传限制对齐 Spring multipart max-request-size（20MB）
    client_max_body_size 20m;

    # 后端反向代理：/prod-api/v1/xxx -> http://server:8080/v1/xxx（自动去 /prod-api 前缀）
    location /prod-api/ {
        proxy_pass http://server:8080/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header REMOTE-HOST $remote_addr;

        # SSE / WebSocket 长连接支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # 前端 SPA：优先静态文件，找不到回退 index.html（history 路由）
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# =====================================================================
# 可选：TLS（生产建议）。启用后：
#   server { listen 443 ssl http2; ... ssl_certificate/ssl_certificate_key ... }
# 并将 80 端口统一 redirect 到 https。
# =====================================================================