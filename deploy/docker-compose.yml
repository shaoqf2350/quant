# =====================================================================
# QuantPF 核心服务 Docker Compose（拷贝即跑版）
# ---------------------------------------------------------------
# 一、首次运行前置（宿主机完成，产物目录会被本 compose 挂载）：
#   1) 准备环境变量：cp .env.example .env 并填写全部占位密码/密钥
#      （deploy/.env 已加入 .gitignore，禁止提交）
#   2) 构建后端 jar（产物 ruoyi-admin/target/ruoyi-admin.jar）：
#        cd ../RuoYi-Vue-Plus && ./mvnw -pl ruoyi-admin -am clean package -P prod -DskipTests
#      Windows 用 mvnw.cmd；需 JDK21 + Maven
#   3) 构建前端 dist（产物 plus-ui/dist）：
#        cd ../plus-ui && pnpm install && pnpm build
#   （本 compose 无 Dockerfile，直接挂载上述两个产物，因此必须先构建）
#
# 二、启动：docker compose up -d
#   访问：前端 http://localhost （宿主 NGINX_HTTP_PORT，默认 80）
#
# 三、外部 AI 研究引擎（独立 Compose 项目，见 deploy/dify、deploy/tradingagents）：
#   Spring Boot 通过 host.docker.internal 访问其宿主端口（Dify api=5001、TA=8000）。
#   若改为与 QuantPF 共网络，把 DIFY_BASE_URL / TRADING_AGENTS_BASE_URL 换成容器服务名。
#
# 四、数据库初始化（自动）：
#   * RuoYi 系统表 sys_* 由 mysql 首次启动时执行 quantpf_init_sys_tables.sql 完成；
#   * QuantPF 业务表 quantpf_* 由 Spring Boot 启动时 Flyway 自动迁移（V1_0_0~V1_9_0）。
# =====================================================================

name: quantpf

services:
  # ---------------- MySQL（业务主库，schema=quantpf） ----------------
  mysql:
    image: mysql:8.4
    container_name: qpf-mysql
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quantpf}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --explicit_defaults_for_timestamp=true
      - --lower_case_table_names=1
      - --max_allowed_packet=64M
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      # RuoYi 系统表（sys_*）：只在首次空库启动时自动执行；quantpf_* 业务表交给 Flyway
      - ../RuoYi-Vue-Plus/script/sql/quantpf_init_sys_tables.sql:/docker-entrypoint-initdb.d/quantpf_init_sys_tables.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [qpf-net]
    restart: unless-stopped

  # ---------------- Redis（缓存 / 锁 / 发布订阅） ----------------
  redis:
    image: redis:7-alpine
    container_name: qpf-redis
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [qpf-net]
    restart: unless-stopped

  # ---------------- MinIO（对象存储：快照 / 附件 / Dify Dataset 副本） ----------------
  minio:
    image: pgsty/minio:RELEASE.2026-04-17T00-00-00Z   # 亦可换官方 minio/minio 同能力版本
    container_name: qpf-minio
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-quantpf}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server --address ':9000' --console-address ':9001' /data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      # 若所用镜像无 curl，可改用 minio/mc 就绪探测或移除本项
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [qpf-net]
    restart: unless-stopped

  # ---------------- Spring Boot（唯一事实源 / 主服务） ----------------
  server:
    image: bellsoft/liberica-openjdk-rocky:21.0.12-cds
    container_name: qpf-server
    working_dir: /ruoyi/server
    environment:
      TZ: Asia/Shanghai
      # 强制 prod profile；对应挂载的 config/application-prod.yml（Spring 默认优先读 ./config/）
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-Xms2g -Xmx4g -XX:+UseZGC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/ruoyi/server/logs"
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quantpf}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-quantpf}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-qpf-snapshots}
      JWT_SECRET: ${JWT_SECRET}
      XXL_JOB_ADMIN_ADDRESSES: ${XXL_JOB_ADMIN_ADDRESSES:-http://xxl-job-admin:8080/xxl-job-admin}
      XXL_JOB_ACCESS_TOKEN: ${XXL_JOB_ACCESS_TOKEN:-}
      DIFY_BASE_URL: ${DIFY_BASE_URL:-http://host.docker.internal:5001}
      DIFY_APP_API_KEY: ${DIFY_APP_API_KEY:-}
      TRADING_AGENTS_BASE_URL: ${TRADING_AGENTS_BASE_URL:-http://host.docker.internal:8000}
      TRADING_AGENTS_API_KEY: ${TRADING_AGENTS_API_KEY:-}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
    # Linux 下让 host.docker.internal 解析到宿主机（Windows/Mac Docker Desktop 自带支持）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../RuoYi-Vue-Plus/ruoyi-admin/target/ruoyi-admin.jar:/ruoyi/server/app.jar:ro
      # 生产配置外挂：./config 是 Spring 默认配置位置，优先级高于 jar 内配置
      - ./application-prod.yml:/ruoyi/server/config/application-prod.yml:ro
      # DuckDB 嵌入式数据文件（仅 Tick + K线，ADR-9）；单写者=单实例
      - ./data/duckdb:/data/duckdb
      - ./logs/server:/ruoyi/server/logs
    command: ["sh", "-c", "exec java -Djava.security.egd=file:/dev/./urandom -Dserver.port=8080 $JAVA_OPTS -jar app.jar"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      # 仅探测 8080 端口就绪（Spring Boot 完成启动并 bind 端口后即为可服务）
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks: [qpf-net]
    restart: unless-stopped

  # ---------------- 前端（plus-ui 静态 + /prod-api 反代） ----------------
  web:
    image: nginx:1.27-alpine
    container_name: qpf-web
    depends_on:
      - server
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ../plus-ui/dist:/usr/share/nginx/html:ro
      - ./nginx/quantpf.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [qpf-net]
    restart: unless-stopped

  # ===================================================================
  # 可选：XXL-JOB 调度中心（ADR-10 已下线 SnailJob，未来统一用 XXL-JOB 3.1.0）。
  # 当前代码尚未接入调度，核心应用 server 不依赖它也能运行。
  # 需要用周频/日频机会扫描与任务审计时，取消注释并确认镜像 tag 与 xxl_job 库初始化。
  # ===================================================================
  # xxl-job-admin:
  #   image: xuxueli/xxl-job-admin:3.1.0   # 以实际采用的 3.1.0 镜像 tag 为准（见详设9 §18.2）
  #   container_name: qpf-xxl-job-admin
  #   environment:
  #     TZ: Asia/Shanghai
  #     PARAMS: "--spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true --spring.datasource.username=${MYSQL_USER} --spring.datasource.password=${MYSQL_PASSWORD} --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:-}"
  #   ports:
  #     - "${XXL_JOB_ADMIN_PORT:-8090}:8080"
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #   networks: [qpf-net]
  #   restart: unless-stopped

networks:
  qpf-net:
    driver: bridge